<!DOCTYPE html>
<html>
<head>
    <title>Bloodhound</title>
    <style>
        :root { color-scheme: light; font-family: Arial, sans-serif; }
        body { margin: 0; padding-top: 2rem; background-color: #f8f9fa; color: #1f2933; }
        .container { max-width: 1080px; margin: 0 auto; padding: 0 1rem; }
        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 1rem; margin-bottom: 1.5rem; border-bottom: 1px solid #d9e2ec; }
        nav a { margin-left: 1rem; color: #1f2933; text-decoration: none; }
        h1, h2, h5, h6 { margin-top: 0; }
        .row { display: flex; flex-wrap: wrap; gap: 1rem; }
        .col-md-4 { flex: 1 1 260px; }
        .col-md-8, .col-md-12 { flex: 2 1 520px; }
        .card { margin-bottom: 1.5rem; background: #fff; border: 1px solid #d9e2ec; border-radius: 8px; }
        .card-body, .card-header { padding: 1rem; }
        .card-header { border-bottom: 1px solid #d9e2ec; display: flex; justify-content: space-between; }
        .btn { display: inline-block; padding: .45rem .75rem; border-radius: 6px; border: 1px solid #bcccdc; text-decoration: none; color: #1f2933; background: #fff; }
        .btn-primary { background: #1261a6; color: #fff; border-color: #1261a6; }
        .btn-outline-success { border-color: #17803d; color: #17803d; }
        .btn-outline-secondary { border-color: #627d98; color: #334e68; }
        .badge { display: inline-block; padding: .25rem .45rem; border-radius: 999px; background: #627d98; color: #fff; font-size: .85rem; }
        .bg-primary { background: #1261a6; }
        .bg-secondary { background: #627d98; }
        .text-muted { color: #627d98; }
        .text-danger { color: #b42318; }
        .text-success { color: #17803d; }
        .text-warning { color: #9a6700; }
        .border-warning { border-color: #d99a00; }
        .alert { padding: .75rem 1rem; border-radius: 6px; margin-bottom: 1rem; }
        .alert-danger { background: #fee4e2; color: #7a271a; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: .75rem; border-bottom: 1px solid #d9e2ec; }
        .display-4 { font-size: 2.5rem; margin: .5rem 0; }
        .list-group { list-style: none; padding: 0; margin: 0; }
        .list-group-item { display: flex; justify-content: space-between; align-items: center; padding: .75rem 0; border-bottom: 1px solid #d9e2ec; }
        .mb-3 { margin-bottom: 1rem; }
        .mb-4 { margin-bottom: 1.5rem; }
        .mt-3 { margin-top: 1rem; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1 class="h3">Bloodhound AI Talent Pool</h1>
            <nav>
                <a href="/">Home</a>
                <a href="/candidates">Candidates</a>
                <a href="/review">Review</a>
            </nav>
        </header>
        
        <main>
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
