<!DOCTYPE html>
<html>
<head>
    <title>Bloodhound Login</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f8f9fa; color: #1f2933; }
        main { max-width: 420px; margin: 4rem auto; padding: 1rem; }
        form { background: #fff; border: 1px solid #d9e2ec; border-radius: 8px; padding: 1rem; }
        label, input, button { display: block; width: 100%; box-sizing: border-box; }
        label { margin-bottom: .5rem; }
        input { padding: .6rem; margin-bottom: 1rem; border: 1px solid #bcccdc; border-radius: 6px; }
        button { padding: .65rem; border: 0; border-radius: 6px; background: #1261a6; color: #fff; }
    </style>
</head>
<body>
    <main>
        <form method="get" action="/login">
            <label for="token">Admin token</label>
            <input id="token" name="token" type="password" autocomplete="current-password">
            <button type="submit">Sign in</button>
        </form>
    </main>
</body>
</html>
